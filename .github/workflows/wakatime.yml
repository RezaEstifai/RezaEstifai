name: WakaTime Daily Stats

on:
  schedule:
    - cron: '0 0 * * *'  # runs every day at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: "true"             # Shows a nice title
          SECTION_NAME: "waka"           # Section name in README
          BLOCKS: "█▇▆▅▄▃▂▁░"            # Prettier progress bars
          CODE_LANG: "txt"               # Code block style
          TIME_RANGE: "today"            # ✅ ONLY TODAY!
          LANG_COUNT: "5"                # Top 5 languages
          SHOW_TIME: "true"              # Show time in hours/mins
          SHOW_TOTAL: "true"             # Show total time today
          SHOW_MASKED_TIME: "false"
          STOP_AT_OTHER: "false"
          COMMIT_MESSAGE: "Update WakaTime stats (Today)"
