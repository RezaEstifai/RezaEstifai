name: WakaTime Daily Stats

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (minimum GitHub allows)
  push:
    branches: [ main ]      # also updates whenever you push
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: waka-readme
  cancel-in-progress: true  # avoids overlapping runs

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TIME_RANGE: "today"
          SHOW_TITLE: "true"
          SECTION_NAME: "waka"
          BLOCKS: "█▇▆▅▄▃▂▁░"
          CODE_LANG: "txt"
          LANG_COUNT: "5"
          SHOW_TIME: "true"
          SHOW_TOTAL: "true"
          STOP_AT_OTHER: "false"
          COMMIT_MESSAGE: "Update WakaTime stats (today)"
