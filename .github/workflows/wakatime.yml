name: WakaTime Daily Stats

on:
  schedule:
    - cron: '*/5 * * * *'   # Runs every 5 minutes (minimum GitHub allows)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waka-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: "true"             # Show "📊 WakaTime Stats"
          SECTION_NAME: "waka"           # Section name in README
          BLOCKS: "█▇▆▅▄▃▂▁░"            # Nicer progress bars
          CODE_LANG: "txt"               # Code style
          TIME_RANGE: "today"            # ✅ ONLY TODAY
          LANG_COUNT: "5"                # Top 5 languages
          SHOW_TIME: "true"              # Show duration (e.g., 24 mins)
          SHOW_TOTAL: "true"             # ✅ Show total for TODAY
          SHOW_MASKED_TIME: "false"
          STOP_AT_OTHER: "false"
          COMMIT_MESSAGE: "Update WakaTime stats (Today)"
