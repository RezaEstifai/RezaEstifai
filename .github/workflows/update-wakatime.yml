name: Update WakaTime Stats (Python)

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:        # manual run button

permissions:
  contents: write           # allow committing changes

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Run WakaTime updater script
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}         # e.g. rezaestifai/RezaEstifai
          BRANCH: ${{ github.ref_name }}         # current branch (main)
          README_PATH: README.md
          TIME_RANGE: today                      # or: last_7_days, yesterday
          DRY_RUN: "0"                           # "1" to test without committing
        run: python update_wakatime_readme.py
